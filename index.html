<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriana - Accede a nuestras Ofertas</title>
    <style>
        :root {
            --dark: #32134D;
            --cream: #F8F0FF;
            --gold: #C6A15B;
            --white: #FFFFFF;
            --purple: #8E55C7;
            --lavender: #E9D5FF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: var(--dark);
            color: var(--white);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .lang-selector {
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--gold);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn.active, .lang-btn:hover {
            background: var(--gold);
            color: var(--dark);
        }

        /* HERO */
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .hero h2 {
            font-size: 2.2rem;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1rem;
            color: #5a3d6e;
            max-width: 600px;
            margin: 0 auto;
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            max-width: 600px;
            margin: 20px auto 60px;
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(50, 19, 77, 0.15);
            border-top: 6px solid var(--gold);
        }

        /* FORMULARIO */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--lavender);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--cream);
            color: var(--dark);
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--purple);
        }

        textarea { resize: vertical; min-height: 80px; }

        /* BOTÓN */
        .btn {
            width: 100%;
            background: var(--purple);
            color: var(--white);
            border: 2px solid var(--purple);
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--dark);
            border-color: var(--dark);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* MENSAJE ESTADO */
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.loading { background: var(--lavender); color: var(--dark); display: block; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            color: #8a7a9a;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .hero h2 { font-size: 1.6rem; }
            .container { padding: 25px; margin: 15px; }
            header { padding: 15px 20px; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ADRIANA LEADS</h1>
        <div class="lang-selector">
            <button class="lang-btn active" onclick="setLanguage('es')">ES</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
    </header>

    <section class="hero">
        <h2 data-i18n="heroTitle">Accede a nuestras Ofertas Exclusivas</h2>
        <p data-i18n="heroSubtitle">Selecciona la oferta o producto de tu interés e ingresa tus datos para acceder inmediatamente.</p>
    </section>

    <main class="container">
        <form id="leadForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="producto" data-i18n="labelProduct">Selecciona un producto:</label>
                <select id="producto" required>
                    <option value="" data-i18n="selectPlaceholder">Cargando productos...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nombre" data-i18n="labelName">Nombre:</label>
                <input type="text" id="nombre" required data-i18n-placeholder="phName" placeholder="Tu nombre completo">
            </div>

            <div class="form-group">
                <label for="correo" data-i18n="labelEmail">Correo:</label>
                <input type="email" id="correo" required data-i18n-placeholder="phEmail" placeholder="tu@correo.com">
            </div>

            <div class="form-group">
                <label for="mensaje" data-i18n="labelMessage">Mensaje (opcional):</label>
                <textarea id="mensaje" data-i18n-placeholder="phMessage" placeholder="Escribe un mensaje..."></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn" data-i18n="btnAccess">ACCEDER AHORA</button>

            <div class="status" id="status"></div>
        </form>
    </main>

    <footer>
        <p>© 2026 Adriana Leads</p>
    </footer>

    <script>
        // =====================================================
        // ⚠️ CONFIGURA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
        // (Instrucciones en la PARTE 2 de la respuesta)
        // =====================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeMuaV0zYGCxB2kVJcSCZqprgBAdSY2jYGX9NcX2nv-bjAAMfGINP99y9O5ZceX1y2/exec";

        // =====================================================
        // TRADUCCIONES
        // =====================================================
        const translations = {
            es: {
                heroTitle: "Accede a nuestras Ofertas Exclusivas",
                heroSubtitle: "Selecciona la oferta o producto de tu interés e ingresa tus datos para acceder inmediatamente.",
                labelProduct: "Selecciona un producto:",
                labelName: "Nombre:",
                labelEmail: "Correo:",
                labelMessage: "Mensaje (opcional):",
                btnAccess: "ACCEDER AHORA",
                selectPlaceholder: "Selecciona una opción",
                phName: "Tu nombre completo",
                phEmail: "tu@correo.com",
                phMessage: "Escribe un mensaje...",
                loading: "Cargando productos...",
                required: "Por favor completa todos los campos obligatorios.",
                sending: "Enviando datos...",
                error: "Hubo un error. Intenta de nuevo.",
                noProducts: "No hay productos disponibles."
            },
            en: {
                heroTitle: "Access our Exclusive Offers",
                heroSubtitle: "Select the offer or product of your interest and enter your details to access immediately.",
                labelProduct: "Select a product:",
                labelName: "Name:",
                labelEmail: "Email:",
                labelMessage: "Message (optional):",
                btnAccess: "ACCESS NOW",
                selectPlaceholder: "Select an option",
                phName: "Your full name",
                phEmail: "your@email.com",
                phMessage: "Write a message...",
                loading: "Loading products...",
                required: "Please fill in all required fields.",
                sending: "Sending data...",
                error: "There was an error. Please try again.",
                noProducts: "No products available."
            }
        };

        let currentLang = 'es';
        let productLinks = {}; // { nombreProducto: enlace }

        // =====================================================
        // CAMBIO DE IDIOMA
        // =====================================================
        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="setLanguage('${lang}')"]`).classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.setAttribute('placeholder', translations[lang][key]);
            });

            // Actualizar opción placeholder del select
            const sel = document.getElementById('producto');
            if (sel.options[0] && sel.options[0].value === '') {
                sel.options[0].textContent = translations[lang].selectPlaceholder;
            }
        }

        // =====================================================
        // CARGAR PRODUCTOS DESDE GOOGLE SHEETS
        // =====================================================
        async function loadProducts() {
            const select = document.getElementById('producto');
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getProducts`);
                const data = await res.json();

                select.innerHTML = '';
                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = translations[currentLang].selectPlaceholder;
                select.appendChild(placeholder);

                if (!data.products || data.products.length === 0) {
                    placeholder.textContent = translations[currentLang].noProducts;
                    return;
                }

                data.products.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.producto;
                    opt.textContent = p.producto;
                    productLinks[p.producto] = p.enlace;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Error cargando productos:', err);
                select.innerHTML = `<option value="">Error al cargar productos</option>`;
            }
        }

        // =====================================================
        // ENVIAR FORMULARIO
        // =====================================================
        async function submitForm(e) {
            e.preventDefault();
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            const producto = document.getElementById('producto').value;
            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const mensaje = document.getElementById('mensaje').value.trim();

            if (!producto || !nombre || !correo) {
                statusEl.className = 'status error';
                statusEl.textContent = translations[currentLang].required;
                return;
            }

            statusEl.className = 'status loading';
            statusEl.textContent = translations[currentLang].sending;
            btn.disabled = true;

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ producto, nombre, correo, mensaje }).toString()
                });

                statusEl.className = 'status success';
                statusEl.textContent = '✅ Redirigiendo...';

                const enlace = productLinks[producto];
                if (enlace) {
                    setTimeout(() => {
                        window.open(enlace, '_blank');
                        document.getElementById('leadForm').reset();
                        statusEl.className = 'status';
                        btn.disabled = false;
                    }, 1200);
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = translations[currentLang].error;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                statusEl.className = 'status error';
                statusEl.textContent = translations[currentLang].error;
                btn.disabled = false;
            }
        }

        // Inicializar
        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('es');
            loadProducts();
        });
    </script>
</body>
</html>
